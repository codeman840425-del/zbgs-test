<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>人体资产候选 · 准入检查</title>
    <style>
      body {
        margin: 0;
        background: #e7ede3;
        color: #253c38;
        font: 16px system-ui;
      }
      main {
        display: grid;
        grid-template-columns: minmax(400px, 1fr) 330px;
        height: 100vh;
      }
      #stage {
        min-height: 620px;
        position: relative;
      }
      canvas {
        display: block;
      }
      aside {
        padding: 24px;
        background: #faf8f1;
        overflow: auto;
      }
      h1 {
        font-size: 25px;
      }
      p {
        line-height: 1.6;
      }
      button,
      select {
        padding: 10px;
        margin: 4px;
        border: 1px solid #91a89a;
        border-radius: 5px;
        background: white;
        color: inherit;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #d5e3d8;
      }
      pre {
        font-size: 12px;
        white-space: pre-wrap;
      }
      a {
        color: #216d60;
      }
      .note {
        background: #fff0c7;
        padding: 12px;
      }
      #status {
        position: absolute;
        bottom: 16px;
        left: 16px;
        background: #faf8f1;
        padding: 10px;
      }
      @media (max-width: 750px) {
        main {
          display: block;
          height: auto;
        }
        #stage {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="stage"><div id="status">读取候选资产…</div></div>
      <aside>
        <a href="/">← 返回当前房间样板</a>
        <h1>完整人体候选</h1>
        <p>
          旧版 VRoid 基础模型 · CC0<br />这是资产准入检查，尚未定为正式角色。
        </p>
        <p class="note">
          原模型为基础外观，尚无发型与最终服装。诊断模式用中性颜色显示真实人体表面，不补虚假的覆盖面。这里的动作仅重用重定向，不启用旧角色专用的足部、座位或服装修正。
        </p>
        <h3>查看身体与源外观</h3>
        <button data-body="true">完整人体诊断</button
        ><button data-body="false">源文件外观</button>
        <p>
          <a href="/foundation.html">原始导出</a> ·
          <a href="/foundation.html?source=roundtrip">Blender 重建后再导出</a>
        </p>
        <div>
          <button data-angle="0">正面</button
          ><button data-angle="1.57079632679">侧面</button
          ><button data-angle="3.14159265359">背面</button>
        </div>
        <h3>共用动作接口试播</h3>
        <select id="action">
          <option value="rest">参考姿势</option>
          <option value="idle">站立</option>
          <option value="walk">原地行走</option>
          <option value="dance">短舞蹈</option>
          <option value="sitEnter">坐下源动作</option>
          <option value="sitIdle">坐姿源动作</option>
          <option value="sitExit">起立源动作</option>
        </select>
        <button id="pause">暂停</button>
        <p>原地行走用于查重定向。无椅子接触标定，不能据此宣布坐起通过。</p>
        <h3>脸部能力</h3>
        <select id="expression">
          <option value="">自然</option>
          <option value="blink">眨眼</option>
          <option value="aa">口型 aa</option>
          <option value="ih">口型 ih</option>
          <option value="happy">微笑</option></select
        ><button id="face">脸部近景</button>
        <p>表情预设与外貌参数分开。未具备完整捏脸或体型参数。</p>
        <pre id="metrics"></pre>
      </aside>
    </main>
    <script type="module" src="/src/foundation-preview.js"></script>
  </body>
</html>
