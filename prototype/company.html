<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>公司场景 · 制作预览</title><link rel="icon" href="data:,"></head>
<body>
  <header class="topbar"><div><span class="eyebrow">COMPANY STUDIO</span><h1>公司场景</h1></div><p>组件组合与布局预览</p><span id="build-label" class="build">开发预览</span></header>
  <main>
    <aside aria-label="方案与观看设置">
      <section><h2>观看方案</h2><label for="layout">选择布局</label><select id="layout"><option value="studio">双工位与休息区</option><option value="base">双工位 · 并排布局</option><option value="alternate">双工位 · 转向布局</option><option value="custom" disabled>自定义方案</option></select><p class="hint">同一套组件，由布局配置组合。</p><label for="sofa">沙发样件</label><select id="sofa"><option value="1">低靠背 · 草绿色</option><option value="2">高靠背 · 暖色变体</option></select></section>
      <section><h2>查看空间</h2><div class="button-row"><button data-view="room" aria-pressed="true">室内总览</button><button data-view="top" aria-pressed="false">俯视布局</button><button data-view="station" aria-pressed="false">工位近景</button><button data-view="sofa" aria-pressed="false">沙发近景</button></div><p class="hint">拖动旋转，滚轮缩放。也可用视角按钮切换。</p></section>
      <section><h2>设施状态</h2><label for="station">选择工位</label><select id="station"><option value="station-1">工位一</option><option value="station-2">工位二</option></select><div class="button-row"><button id="screen">关闭屏幕</button><button id="light">关闭补光</button></div><label for="fabric" class="spaced-label">沙发面料方案</label><select id="fabric"><option value="original">素材原色</option><option value="blue">深蓝面料</option><option value="custom" disabled>自定义面料</option></select></section>
      <section><h2>保存与继续修改</h2><div class="button-row"><button id="save" class="primary">保存方案</button><button id="restore">恢复已保存</button><button id="export">导出方案</button><button id="import">加载文件</button></div><input id="file" type="file" accept=".json,application/json" hidden><p class="hint">保存布局、组件关系、设备状态和资源版本。</p></section>
      <p class="scope">场景制作预览。角色实际使用将在统一接入后验证。</p>
    </aside>
    <section class="viewport" aria-label="三维公司场景"><div id="stage"></div><div id="phaser-stage" aria-hidden="true"></div><div class="scene-caption"><strong id="scene-name">正在加载场景</strong><span id="scene-count"></span></div></section>
  </main>
  <footer><span id="status" role="status" aria-live="polite">正在准备组件…</span><span>布局与素材由 agent 制作</span></footer>
  <script type="module" src="/src/company/preview.js"></script>
</body></html>
