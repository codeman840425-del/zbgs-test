<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>公司场景 · 制作预览</title><link rel="icon" href="data:,"></head>
<body>
  <header class="topbar"><div><span class="eyebrow">COMPANY STUDIO</span><h1>公司场景</h1></div><p>组件组合与布局预览</p><span id="build-label" class="build">开发预览</span></header>
  <main>
    <aside aria-label="方案与观看设置">
      <section><h2>外观样件对照</h2><label for="sample-branch">设施分类</label><select id="sample-branch"></select><label for="sample-look" class="spaced-label">造型</label><select id="sample-look"></select><button id="sample-show">查看该造型</button><p class="hint">同规格更换实际模型；保留设备状态与实例身份。角色使用另行联调。</p></section>
      <section><h2>观看方案</h2><label for="layout">选择布局</label><select id="layout"><option value="smallHome">民房 · 一套工位</option><option value="studio">单间屋 · 工位与休息区</option><option value="base">单间屋 · 并排布局</option><option value="alternate">单间屋 · 转向布局</option><option value="rental">整套出租屋 · 三房与客厅</option><option value="flat">平层 · 部分配置</option><option value="twoFloors">两层不同布局</option><option value="hinged">开合柜 · 陈列与工位</option><option value="hingedAlternate">开合柜 · 转向布局</option><option value="supports">多层承载 · 陈列与工位</option><option value="supportAlternate">多层承载 · 转向布局</option><option value="ceilingHome">顶面与墙地 · 民房</option><option value="ceilings">顶面与墙地 · 两层住宅</option><option value="surfaces">墙地饰面 · 两层住宅</option><option value="surfaceHome">墙地饰面 · 民房</option><option value="mixed">混合素材公司 · 两层</option><option value="building">大楼 · 部分配置</option><option value="custom" disabled>自定义方案</option></select><p class="hint">同一套组件，由布局配置组合。</p><label for="sofa">沙发样件</label><select id="sofa"><option value="1">软包双人沙发</option><option value="timber">开放木框双人沙发</option><option value="2" disabled>历史宽扶手样件</option></select></section>
      <section><h2>查看空间</h2><label for="floor">楼层</label><select id="floor"></select><label for="room" class="spaced-label">房间与公共区</label><select id="room"></select><label for="wall-view" class="spaced-label">墙体观看</label><select id="wall-view"><option value="cutaway">自动剖切遮挡墙</option><option value="full">完整墙体</option></select><div class="button-row"><button id="floor-view">整层总览</button><button id="building-view">返回楼层剖面</button><button data-view="room" aria-pressed="true">室内总览</button><button data-view="top" aria-pressed="false">俯视布局</button><button data-view="station" aria-pressed="false">工位近景</button><button data-view="sofa" aria-pressed="false">沙发近景</button><button data-view="ceiling" aria-pressed="false">顶面近景</button></div><p class="hint" id="camera-hint">点击房间进入三维查看。</p></section>
      <section><h2>当前房间饰面</h2><p class="hint" id="finish-scope"></p><label for="finish-wall">墙面方案</label><select id="finish-wall"></select><label for="finish-floor" class="spaced-label">地面方案</label><select id="finish-floor"></select><button id="finish-turn">旋转地板方向</button><label for="finish-ceiling" class="spaced-label">顶面方案</label><select id="finish-ceiling"></select><p class="hint">整面替换，保留家具布置与设备状态。</p></section>
      <section><h2>设施状态</h2><label for="station">选择工位</label><select id="station"><option value="station-1">工位一</option><option value="station-2">工位二</option></select><div class="button-row"><button id="screen">关闭屏幕</button><button id="light">关闭补光</button></div><label for="cabinet" class="spaced-label">开合柜</label><select id="cabinet"></select><div class="button-row"><button data-opening="0">关门</button><button data-opening="0.5">半开</button><button data-opening="1">全开</button><button data-view="cabinet">柜体近景</button></div><label for="fabric" class="spaced-label">沙发面料方案</label><select id="fabric"><option value="original">素材原色</option><option value="blue">深蓝面料</option><option value="custom" disabled>自定义面料</option></select></section>
      <section><h2>保存与继续修改</h2><div class="button-row"><button id="save" class="primary">保存方案</button><button id="restore">恢复已保存</button><button id="export">导出方案</button><button id="import">加载文件</button><button id="upgrade">升级所选工位</button></div><input id="file" type="file" accept=".json,application/json" hidden><p class="hint">保存全部楼层、组件关系和设备状态。新模板仅在主动升级后应用。</p></section>
      <p class="scope">场景制作预览。角色实际使用将在统一接入后验证。</p>
    </aside>
    <section class="viewport" aria-label="公司场景预览"><div id="stage"></div><div id="building-stage" hidden></div><div id="region-labels" aria-hidden="true"></div><div id="phaser-stage" aria-hidden="true"></div><div class="scene-caption"><strong id="scene-name">正在加载场景</strong><span id="view-label"></span><span id="scene-count"></span></div></section>
  </main>
  <footer><span id="status" role="status" aria-live="polite">正在准备组件…</span><span>布局与素材由 agent 制作</span></footer>
  <script type="module" src="/src/company/preview.js"></script>
</body></html>
