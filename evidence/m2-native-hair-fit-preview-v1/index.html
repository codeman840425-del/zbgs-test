<h1>入座时的发尾动态</h1>
<p>左边使用原版设置，右边让受影响的发束随上胸运动。两边均开启动态，使用相同的镜头、人物、服装和路线。留意约第 8 秒开始落座时的发尾，以及起身后走动时的摆动。</p>
