<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>男女制服 · 走路与坐起</title>
<style>
body{font:1rem/1.5 system-ui,sans-serif;background:#f5f4ef;color:#203332;margin:clamp(12px,3vw,44px)}
h1{font-size:1.5rem}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:1rem}
figure{margin:0}figcaption{padding:.4rem 0;font-weight:600}video{width:100%;background:#dae0d9}button{font:inherit;margin:0 .5rem 1rem 0;padding:.4rem .8rem;cursor:pointer}
</style>
<h1>男女制服 · 走路与坐起</h1>
<p>同一款式配方生成的男女角色，在同一间房内走向座椅、坐下、起身、离开。两段均按 1 倍速录制。游戏构建 4959572f6d5e。</p>
<button id="play">从头同时播放</button><button id="pause">同时暂停</button>
<main>
  <figure><figcaption>女性 · 及膝裤</figcaption><video controls playsinline muted preload="metadata" src="./room-female/room-produced-1x.webm"></video></figure>
  <figure><figcaption>男性 · 长裤</figcaption><video controls playsinline muted preload="metadata" src="./room-male/room-produced-1x.webm"></video></figure>
</main>
<p><a href="./pair-game/produced-pair-1x.webm">观看两人在独立游戏中的 1 倍速录像</a></p>
<p role="status" id="status"></p>
<script>
const videos = [...document.querySelectorAll('video')];
document.getElementById('play').onclick = async () => {
  const status = document.getElementById('status');
  status.textContent = '';
  try {
    for (const video of videos) { video.pause(); video.currentTime = 0; video.playbackRate = 1; }
    await Promise.all(videos.map(video => video.play()));
  } catch {
    videos.forEach(video => video.pause());
    status.textContent = '播放未能开始。可以使用各段录像的播放按钮重试。';
  }
};
document.getElementById('pause').onclick = () => videos.forEach(video => video.pause());
</script>
</html>
